name: Rebuild Map

# Solo ejecuta en pushes a ramas distintas de main
on:
  push:
    branches-ignore:
      - main
    paths:
      - 'data/BBDDTUI_unida.csv'
      - 'scripts/**'
      - 'templates/**'
      - 'app.py'
      - '.github/workflows/mapa.yml'
  workflow_dispatch: {}

concurrency:
  group: map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install deps for map generator
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Generate map HTML
        run: |
          python scripts/make_map_madrid.py

      # Commitea SIEMPRE (estamos en ramas ≠ main)
      - name: Commit updated map
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/mapa/mapa_madrid.html
          git commit -m "CI: update mapa_madrid.html" || echo "No changes"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push
