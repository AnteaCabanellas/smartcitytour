<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Smart City Tour con OpenAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f172a;          /* slate-900 */
      --panel: #111827;       /* gray-900 */
      --bubble-user: #3b82f6; /* blue-500 */
      --bubble-bot: #0b1222;  /* deep slate */
      --text: #e5e7eb;        /* gray-200 */
      --muted: #94a3b8;       /* slate-400 */
      --accent: #22c55e;      /* green-500 */
      --border: #1f2937;      /* gray-800 */
      --ui-font-size: 12.5px;
      --bubble-font-size: 12.5px;
      --small-font-size: 11.5px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f1f5f9; --panel: #ffffff; --bubble-user: #2563eb;
        --bubble-bot: #f3f4f6; --text: #0f172a; --muted: #475569;
        --accent: #16a34a; --border: #e5e7eb;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(1200px 800px at 20% -10%, rgba(34,197,94,.15), transparent 60%),
                 radial-gradient(900px 600px at 120% 0%, rgba(59,130,246,.12), transparent 50%), var(--bg);
      color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif; line-height: 1.35;
    }
    .shell { max-width: 920px; margin: 0 auto; padding: 24px; display: grid; grid-template-rows: auto 1fr auto; gap: 16px; height: 100dvh; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border: 1px solid var(--border); background: var(--panel); border-radius: 14px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .badge, .today { font-size: 12px; color: var(--muted); }

    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .chip { border: 1px solid var(--border); background: transparent; color: var(--text); padding: 6px 10px; border-radius: 999px; cursor: pointer; font-size: 13px; }
    .chip:hover { border-color: var(--muted); }
    .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }

    #chatbox { border: 1px solid var(--border); background: var(--panel); border-radius: 16px; padding: 12px; display: grid; grid-template-rows: 1fr auto; min-height: 0; }
    #chatlog { overflow-y: auto; padding: 8px; min-height: 280px; max-height: 64vh; scroll-behavior: smooth; }
    .row { display: flex; margin: 10px 0; gap: 10px; }
    .row.user { justify-content: flex-end; }
    .bubble { max-width: min(78%, 680px); padding: 10px 12px; border-radius: 14px; border: 1px solid var(--border); white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
    .user .bubble { background: var(--bubble-user); color: #fff; border-color: transparent; }
    .bot .bubble { background: var(--bubble-bot); }
    .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .bubble h1,.bubble h2,.bubble h3{ margin: .4em 0 .2em; }
    .bubble p{ margin: .4em 0; }
    .bubble ul{ margin: .4em 0 .4em 1.1em; }
    .bubble li{ margin: .25em 0; }
    .bubble code{ padding: 2px 4px; border-radius: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .95em; background: rgba(148,163,184,.2); }
    .bubble pre{ padding: 10px; border-radius: 8px; overflow:auto; background: rgba(148,163,184,.15); border: 1px dashed var(--border); }
    .bubble a{ color: #93c5fd; text-decoration: underline; }

    form#composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 8px; border-top: 1px dashed var(--border); }
    textarea {
      resize: none; min-height: 44px; max-height: 160px; padding: 10px 12px; border-radius: 12px;
      background: transparent; color: var(--text); border: 1px solid var(--border); outline: none;
    }
    textarea:focus { border-color: var(--muted); }
    button.send { padding: 10px 16px; border-radius: 12px; border: none; cursor: pointer; background: linear-gradient(135deg, var(--accent), #10b981); color: #052e16; font-weight: 700; }
    button.send[disabled]{ opacity: .6; cursor: not-allowed; }

    .actions { display: flex; gap: 8px; }
    .ghost { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; font-size: 13px; }
    .ghost:hover{ border-color: var(--muted); }
    .thinking { display:inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4, end) infinite; font-family: monospace; }
    @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <div>
          <strong>Smart City Tour</strong>
          <div class="badge" id="geo-status">Ubicación: desconocida</div> <!-- NEW -->
        </div>
      </div>
      <div class="today" id="today"></div>
    </header>

    <div id="chatbox">
      <div id="chatlog" aria-live="polite"></div>

      <div class="toolbar" style="padding:8px 8px 0;">
        <button class="chip" data-q="museos interesantes">Museos</button>
        <button class="chip" data-q="bares con terraza">Bares</button>
        <button class="chip" data-q="piscinas públicas">Piscinas</button>
        <button class="chip" data-q="parques naturales">Parques</button>

        <label class="toggle"><input type="checkbox" id="plan-hoy" /> Plan para hoy</label>
        <label class="toggle"><input type="checkbox" id="use-geo" /> Usar mi ubicación</label> <!-- NEW -->
        <label class="toggle">Inicio
          <input type="time" id="start-time" value="09:30" style="background:transparent;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:4px 6px;font-size:12px" />
        </label> <!-- NEW -->

        <div class="actions" style="margin-left:auto">
          <button class="ghost" id="clear">Limpiar</button>
          <button class="ghost" id="export">Exportar</button>
        </div>
      </div>

      <form id="composer">
        <textarea id="user-input" placeholder="Escribe tu mensaje... (Shift+Enter para nueva línea)" required></textarea>
        <button type="submit" class="send" id="send">Enviar</button>
      </form>
    </div>
  </div>

  <script>
    // ===== Utilidades =====
    const $ = (q, node=document) => node.querySelector(q);
    const $$ = (q, node=document) => [...node.querySelectorAll(q)];
    const chatlog = $("#chatlog");
    const input = $("#user-input");
    const sendBtn = $("#send");
    const planHoy = $("#plan-hoy");
    const useGeo = $("#use-geo");               // NEW
    const startTimeEl = $("#start-time");       // NEW
    const todayBox = $("#today");
    const geoStatus = $("#geo-status");         // NEW

    let userLat = null, userLon = null;         // NEW

    function setToday() {
      const d = new Date();
      const fmt = new Intl.DateTimeFormat("es-ES", { dateStyle: "full", timeStyle: "short" });
      todayBox.textContent = fmt.format(d);
    }
    setToday();

    // Persistencia simple
    let chatHistory = JSON.parse(localStorage.getItem("chatHistory") || "[]");
    function saveHistory(){ localStorage.setItem("chatHistory", JSON.stringify(chatHistory)); }

    if (chatHistory.length === 0) {
      addBot("¡Hola! ¿En qué puedo ayudarte hoy?");
      chatHistory.push({ role: "assistant", content: "¡Hola! ¿En qué puedo ayudarte hoy?" });
      saveHistory();
    } else {
      chatHistory.forEach(m => addRow(m.role, m.content, false));
      scrollBottom();
    }

    // ===== Markdown muy básico =====
    function mdToHtml(md) {
      md = md.replace(/[<>&]/g, s => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[s]));
      md = md.replace(/```([\s\S]*?)```/g, (m, p1) => `<pre><code>${p1}</code></pre>`);
      md = md.replace(/`([^`]+)`/g, '<code>$1</code>');
      md = md.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      md = md.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      md = md.replace(/(https?:\/\/[^\s)]+)(?![^<]*>)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
      md = md.replace(/(?:^|\n)[\-\•]\s+(.*)/g, (m, p1) => `\n<li>${p1}</li>`);
      md = md.replace(/(<li>[\s\S]*<\/li>)/g, '<ul>$1</ul>');
      md = md.replace(/\n{2,}/g, '\n\n').replace(/\n/g, '<br>');
      return md;
    }

    function addRow(role, text, withTime=true) {
      const row = document.createElement("div");
      row.className = `row ${role}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = role === "assistant" ? mdToHtml(text) : text;
      row.appendChild(bubble);

      if (withTime) {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = new Intl.DateTimeFormat("es-ES", { hour: "2-digit", minute: "2-digit" }).format(new Date());
        bubble.appendChild(document.createElement("br"));
        bubble.appendChild(meta);
      }
      chatlog.appendChild(row);
    }

    function addUser(text) { addRow("user", text); }
    function addBot(text)  { addRow("assistant", text); }
    function scrollBottom(){ chatlog.scrollTop = chatlog.scrollHeight; }

    $$(".chip").forEach(b => b.addEventListener("click", () => {
      const q = normalizeQuery(b.dataset.q || "");
      input.value = q;
      input.focus();
    }));

    $("#clear").addEventListener("click", () => {
      chatHistory = [];
      localStorage.removeItem("chatHistory");
      chatlog.innerHTML = "";
      addBot("Conversación reiniciada. ¿Qué te gustaría buscar?");
      chatHistory.push({ role: "assistant", content: "Conversación reiniciada. ¿Qué te gustaría buscar?" });
      saveHistory();
    });

    $("#export").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(chatHistory, null, 2)], {type: "application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `smart-city-tour_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    });

    /* ==========================
       Normalización semántica
       ========================== */
    const CANON_MAP = [
      { re: /\b(piscinas?\s+p(ú|u)blicas?)\b/i, canon: "piscinas" },
      { re: /\b(piscina(s)?\s+cubierta(s)?)\b/i, canon: "piscinas" },
      { re: /\b(gimnasios?)\b/i, canon: "gimnasios" },
      { re: /\b(spas?|balnearios?)\b/i, canon: "spas y balnearios urbanos" },
      { re: /\b(pistas?\s+de\s+hielo)\b/i, canon: "pistas de hielo" },
      { re: /\b(parques?\s+naturales?)\b/i, canon: "parques y jardines" },
      { re: /\b(galer(í|i)as?\s+de\s+arte)\b/i, canon: "galerías de arte" },
      { re: /\b(zoo(l(ó|o)gicos?)?|zoo)\b/i, canon: "zoológico" },
      { re: /\b(caf(é|e)s?)\b/i, canon: "cafés" },
      { re: /\b(cocteler(í|i)as?)\b/i, canon: "coctelerías" },
      { re: /\b(bare?s?\s+con\s+terraza)\b/i, canon: "bares con terraza" },
      { re: /\b(oficina(\s+de)?\s+turismo)\b/i, canon: "oficina turismo" },
      { re: /\b(atracciones?\s+tur(í|i)sticas?)\b/i, canon: "atracciones turísticas" },
      { re: /\b(estaci(ó|o)n\s+de\s+metro)\b/i, canon: "transporte estacion metro" },
      { re: /\b(estaci(ó|o)n\s+de\s+tren)\b/i, canon: "transporte estacion tren" },
      { re: /\b(parada\s+de?\s*bus)\b/i, canon: "parada_bus" },
    ];
    const PLAN_HINTS = [
      /\b(hoy|esta\s+ma(ñ|n)ana|esta\s+tarde|esta\s+noche|este\s+finde|fin\s+de\s+semana)\b/i,
      /\b(itinerario|ruta|tour|recorrido|agenda|plan(ificaci(ó|o)n)?)\b/i
    ];
    function normalizeQuery(raw) {
      let q = raw.trim();
      CANON_MAP.forEach(({re, canon}) => { q = q.replace(re, canon); });
      return q.replace(/\s{2,}/g, " ").trim();
    }
    function shouldPlan(raw) { return PLAN_HINTS.some(re => re.test(raw)); }

    // ===== Geolocalización (opcional) =====
    async function requestGeo() { // NEW
      if (!navigator.geolocation) {
        geoStatus.textContent = "Ubicación: no soportada";
        return;
      }
      geoStatus.textContent = "Ubicación: solicitando permiso…";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLat = +(pos.coords.latitude.toFixed(6));
          userLon = +(pos.coords.longitude.toFixed(6));
          geoStatus.textContent = `Ubicación: ✓ (${userLat}, ${userLon})`;
        },
        (err) => {
          geoStatus.textContent = "Ubicación: denegada o no disponible";
          userLat = userLon = null;
          console.warn("Geolocation error:", err);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
      );
    }
    useGeo.addEventListener("change", () => { // NEW
      if (useGeo.checked) requestGeo();
      else { userLat = userLon = null; geoStatus.textContent = "Ubicación: desactivada"; }
    });

    // ===== Envío (con normalización + plan + ubicación)
    $("#composer").addEventListener("submit", async (e) => {
      e.preventDefault();
      const raw = input.value.trim();
      if (!raw) return;

      const qNorm = normalizeQuery(raw);
      const usePlan = planHoy.checked || shouldPlan(raw);
      const pregunta = usePlan ? `plan para hoy: ${qNorm}` : qNorm;

      chatHistory.push({ role: "user", content: pregunta });
      saveHistory();
      addUser(raw);
      input.value = "";
      input.style.height = "auto";

      const thinking = document.createElement("div");
      thinking.className = "row assistant";
      thinking.innerHTML = `<div class="bubble">Pensando<span class="thinking">...</span></div>`;
      chatlog.appendChild(thinking);
      scrollBottom();

      sendBtn.disabled = true;

      try {
        // NEW: montamos el payload para el backend mejorado
        const payload = {
          messages: chatHistory,
          start_time: startTimeEl.value || "09:30",
        };
        if (useGeo.checked && userLat != null && userLon != null) {
          payload.start_lat = userLat;
          payload.start_lon = userLon;
          // (Opcionales) puedes exponer sliders/inputs si quieres:
          // payload.max_hop_km = 20;
          // payload.max_radius_km = 35;
          // payload.visit_minutes = 60;
        }

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 30000);
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        clearTimeout(timeout);

        const data = await res.json();
        const lastBubble = thinking.querySelector(".bubble");
        if (data && data.response) {
          lastBubble.innerHTML = mdToHtml(data.response);
          chatHistory.push({ role: "assistant", content: data.response });
          saveHistory();
          enhanceNoMatch(raw, data.response, lastBubble);
        } else {
          lastBubble.textContent = "❌ Error en la respuesta";
        }
      } catch (err) {
        const lastBubble = thinking.querySelector(".bubble");
        lastBubble.textContent = "❌ Error al contactar con el servidor.";
      } finally {
        sendBtn.disabled = false;
        scrollBottom();
      }
    });

    // textarea auto-grow
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        $("#composer").requestSubmit();
      }
    });

    // Fallback UX
    function isNoMatch(text) {
      const t = (text || "").toLowerCase();
      return t.includes("no encontr") || t.includes("no tengo datos");
    }
    function enhanceNoMatch(userRaw, assistantText, bubbleEl) {
      if (!isNoMatch(assistantText)) return;
      const soft = normalizeQuery(userRaw);
      const suggestions = [];
      if (/piscina/i.test(soft)) suggestions.push("piscinas");
      if (/parque/i.test(soft)) suggestions.push("parques y jardines");
      if (/muse/i.test(soft)) suggestions.push("museos");
      if (/bar/i.test(soft)) suggestions.push("bares con terraza");

      if (suggestions.length) {
        const sug = suggestions.map(s => `• ${s}`).join("<br>");
        const html = `<br><div class="meta">¿Te refieres a alguna de estas búsquedas?<br>${sug}</div>`;
        bubbleEl.insertAdjacentHTML("beforeend", html);
      }
    }
  </script>
</body>
</html>
