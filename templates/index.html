<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mi sitio — Smart City Tour</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* ---------------- Launcher & Iframe (widget) ---------------- */
    :root{
      /* Colores en sintonía con el chat */
      --sct-blue:  #2563eb;   /* bubble-user principal */
      --sct-blue2: #3b82f6;   /* gradiente */
      --sct-green: #22c55e;   /* acento */
    }

    /* Botón flotante (burbuja) */
    #sct-launcher{
      position:fixed; right:24px; bottom:24px; z-index:99998;
      width:64px; height:64px; border-radius:50%; border:none; cursor:pointer;
      color:#fff;
      background: radial-gradient(120% 120% at 70% 20%, var(--sct-blue2) 0%, var(--sct-blue) 60%);
      box-shadow: 0 18px 38px rgba(0,0,0,.28), inset 0 2px 8px rgba(255,255,255,.12);
      display:grid; place-items:center;
      transition: transform .15s ease, filter .15s ease, box-shadow .2s ease;
    }
    #sct-launcher:hover{ filter:brightness(1.08); }
    #sct-launcher:active{ transform: translateY(1px) scale(.98); }
    #sct-launcher svg{ display:block; }

    /* halo sutil */
    #sct-launcher::after{
      content:""; position:absolute; inset:-6px; border-radius:inherit;
      background: radial-gradient(60% 60% at 50% 50%, rgba(34,197,94,.18), transparent 70%);
      opacity:.7; filter: blur(6px); pointer-events:none;
    }

    /* Rebote al abrir */
    @keyframes sct-bounce-in{
      0%   { transform: translateY(12px) scale(.85); box-shadow: 0 12px 28px rgba(0,0,0,.22); }
      55%  { transform: translateY(-6px) scale(1.04); }
      80%  { transform: translateY(2px)  scale(.99); }
      100% { transform: translateY(0)    scale(1); }
    }
    #sct-launcher.rebote{ animation: sct-bounce-in .5s cubic-bezier(.2,.8,.2,1); }

    /* Iframe del chat (tamaño grande) */
    #sct-frame{
      position:fixed; right:24px; bottom:104px; z-index:99999;
      width: 860px;    /* ⇦ ajusta a tu gusto (720/900/etc.) */
      height: 82vh;    /* ⇦ alto visible */
      border:0; border-radius:20px; box-shadow:0 14px 44px rgba(0,0,0,.35);
      display:none; background:transparent;
    }

    /* Responsive */
    @media (max-width: 920px){
      #sct-frame{ left:4vw; right:4vw; width:auto; height:82vh; bottom:96px; }
    }
    @media (prefers-reduced-motion: reduce){
      #sct-launcher{ transition:none }
      #sct-launcher.rebote{ animation:none }
    }

    /* Demo de contenido de tu página */
    main{ padding:2rem; font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif; }
  </style>
</head>
<body>

  <main>
    <h1>Mi sitio</h1>
    <p>Contenido de ejemplo. El chat está en la esquina inferior derecha. 👇</p>
  </main>

  <!-- Botón flotante -->
  <button id="sct-launcher" aria-label="Abrir chat" title="Abrir chat">
    <!-- Icono de burbuja -->
    <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor"
            d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9.8l-3.9 3a1 1 0 0 1-1.6-.8V17H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>
    </svg>
  </button>

  <!-- Iframe del chat mejorado -->
  <iframe id="sct-frame" src="/widget" title="Smart City Tour" loading="lazy"></iframe>

  <script>
    const btn   = document.getElementById('sct-launcher');
    const frame = document.getElementById('sct-frame');
    let open = false;

    const bubbleSVG = `
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor"
              d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9.8l-3.9 3a1 1 0 0 1-1.6-.8V17H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>
      </svg>`;

    function toggleChat(){
      open = !open;
      frame.style.display = open ? 'block' : 'none';
      btn.setAttribute('aria-label', open ? 'Cerrar chat' : 'Abrir chat');
      btn.title = open ? 'Cerrar chat' : 'Abrir chat';
      btn.innerHTML = open ? '✖' : bubbleSVG;

      if (open){
        btn.classList.remove('rebote'); // reinicia anim
        void btn.offsetWidth;           // reflow
        btn.classList.add('rebote');
        btn.addEventListener('animationend', () => btn.classList.remove('rebote'), { once:true });
      }
    }

    btn.addEventListener('click', toggleChat);

    // Rebote inicial opcional al cargar:
    window.addEventListener('load', () => {
      btn.classList.add('rebote');
      btn.addEventListener('animationend', () => btn.classList.remove('rebote'), { once:true });
    });
  </script>
</body>
</html>
